<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>India Geodata</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100%; width: 100%; }
    .header-card {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(255, 255, 255, 0.95);
      padding: 12px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center; font-weight: 600; color: #1c1c1e; backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <div class="header-card">📍 India Geodata Map Hub</div>
  <div id="map"></div>

  <script>
    // Initialize map centered on India
    var map = L.map('map', { zoomControl: false }).setView([22.5937, 78.9629], 5);

    // High-resolution basemap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);
  </script>
</body>
</html>
