<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Prevent iOS / Mac Safari Caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>India Geodata</title>

  <!-- AUTO CACHE CLEANER ENGINE -->
  <script>
    (function() {
      const APP_VERSION = '3.0.0';
      const storedVersion = localStorage.getItem('geo_app_version');

      if (storedVersion !== APP_VERSION) {
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem('geo_app_version', APP_VERSION);
        if (storedVersion !== null) {
          window.location.reload(true);
        }
      }
    })();
  </script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  
  <!-- PMTiles Engine -->
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; width: 100%; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: none !important;
    }
    
    #map { 
      height: 100%; 
      width: 100%; 
      cursor: pointer;
      touch-action: none !important;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Top-Left Control Panel */
    .control-panel {
      position: absolute; top: 15px; left: 15px;
      z-index: 1500; background: rgba(255, 255, 255, 0.95);
      padding: 12px 14px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 8px;
      width: 285px;
    }

    .panel-header {
      font-size: 11px; font-weight: 700; color: #007AFF; 
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .state-select, .search-input {
      font-size: 14px; font-weight: 600; color: #1c1c1e;
      background: #f2f2f7; border: 1px solid #d1d1d6; border-radius: 10px;
      padding: 8px 12px; outline: none; -webkit-appearance: none; width: 100%;
      box-sizing: border-box;
    }

    .search-box { display: flex; gap: 6px; width: 100%; }

    .search-btn {
      background: #007AFF; color: #fff; border: none;
      border-radius: 10px; padding: 8px 14px; font-weight: 600;
      cursor: pointer; font-size: 13px; white-space: nowrap; transition: background 0.2s;
    }

    .clear-btn {
      background: #FF3B30; color: #fff; border: none;
      border-radius: 10px; padding: 8px 12px; font-weight: 600;
      cursor: pointer; font-size: 12px; width: 100%; margin-top: 2px;
    }

    .opacity-control {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600; color: #3a3a3c; margin-top: 2px;
    }

    /* Sliding Info Panel */
    .info-panel {
      position: absolute; top: 255px; left: 15px;
      z-index: 1500; background: rgba(255, 255, 255, 0.98);
      padding: 14px; border-radius: 18px; box-shadow: 0 6px 25px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px); width: 285px; max-height: 50vh;
      overflow-y: auto; display: none; flex-direction: column; gap: 10px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .info-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #e5e5ea; padding-bottom: 8px;
    }

    .info-title { font-size: 15px; font-weight: 700; color: #1c1c1e; margin: 0; }
    
    .panel-actions { display: flex; gap: 6px; }
    .action-btn { 
      background: #e5e5ea; border: none; border-radius: 50%; 
      width: 26px; height: 26px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }

    .section-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #8e8e93; margin-top: 6px; }
    .data-badge { background: #e5f1ff; color: #007AFF; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; display: inline-block; margin-right: 4px; margin-bottom: 4px; }
    .green-badge { background: #e6f9ed; color: #28a745; }

    .custom-pin-icon { background: none; border: none; }

    .leaflet-right { right: 15px !important; z-index: 2000 !important; }
    .leaflet-top { top: 15px !important; z-index: 2000 !important; }
    
    .leaflet-control-layers {
      border-radius: 14px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
      padding: 10px 14px !important;
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      font-weight: 500;
      max-height: 75vh;
      overflow-y: auto;
      z-index: 2000 !important;
    }
  </style>
</head>
<body>

  <!-- Top-Left Navigation & Controls -->
  <div class="control-panel">
    <div class="panel-header">
      <span>📍 India Geodata</span>
      <span style="background: #E5F1FF; padding: 2px 6px; border-radius: 6px;">v3.0 Resilient CDN</span>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search city, town, village..." onkeypress="handleSearchKey(event)" />
      <button id="searchBtn" class="search-btn" onclick="searchPlace()">Go</button>
    </div>

    <!-- State Dropdown -->
    <select id="stateDropdown" class="state-select" onchange="zoomToState(this.value)">
      <option value="22.5937,78.9629,5">India</option>
      <option value="15.9129,79.7400,7">Andhra Pradesh</option>
      <option value="28.2180,94.7278,7">Arunachal Pradesh</option>
      <option value="26.2006,92.9376,7">Assam</option>
      <option value="25.0961,85.3131,7">Bihar</option>
      <option value="21.2787,81.8661,7">Chhattisgarh</option>
      <option value="15.2993,74.1240,10">Goa</option>
      <option value="22.2587,71.1924,7">Gujarat</option>
      <option value="29.0588,76.0856,8">Haryana</option>
      <option value="31.1048,77.1734,8">Himachal Pradesh</option>
      <option value="33.7782,76.5762,7">Jammu & Kashmir</option>
      <option value="23.6102,85.2799,7">Jharkhand</option>
      <option value="15.3173,75.7139,7">Karnataka</option>
      <option value="10.8505,76.2711,8">Kerala</option>
      <option value="34.1526,77.5771,7">Ladakh</option>
      <option value="22.9734,78.6569,7">Madhya Pradesh</option>
      <option value="19.7515,75.7139,7">Maharashtra</option>
      <option value="24.6637,93.9063,8">Manipur</option>
      <option value="25.4670,91.3662,8">Meghalaya</option>
      <option value="23.1645,92.9376,8">Mizoram</option>
      <option value="26.1584,94.5624,8">Nagaland</option>
      <option value="20.9517,85.0985,7">Odisha</option>
      <option value="31.1471,75.3412,8">Punjab</option>
      <option value="27.0238,74.2179,7">Rajasthan</option>
      <option value="27.5330,88.5122,9">Sikkim</option>
      <option value="11.1271,78.6569,7">Tamil Nadu</option>
      <option value="18.1124,79.0193,7">Telangana</option>
      <option value="23.8438,91.2868,9">Tripura</option>
      <option value="26.8467,80.9462,7">Uttar Pradesh</option>
      <option value="30.0668,79.0193,8">Uttarakhand</option>
      <option value="22.9868,87.8550,7">West Bengal</option>
      <option value="28.6139,77.2090,11">Delhi (NCT)</option>
    </select>

    <!-- Overlay Opacity Slider -->
    <div class="opacity-control">
      <span>🎨 Layer Transparency:</span>
      <input type="range" id="opacityRange" min="0.1" max="1.0" step="0.1" value="0.7" oninput="changeOverlayOpacity(this.value)" style="width: 110px;" />
    </div>

    <!-- Clear Map Reset Button -->
    <button class="clear-btn" onclick="clearMapAll()">🧹 Clear Map / Reset Selection</button>
  </div>

  <!-- Sliding Geospatial Info Panel -->
  <div id="infoPanel" class="info-panel">
    <div class="info-header">
      <h3 id="panelTitle" class="info-title">Region Details</h3>
      <div class="panel-actions">
        <button class="action-btn" id="minBtn" onclick="togglePanelMinimize()">−</button>
        <button class="action-btn" onclick="closePanel()">✕</button>
      </div>
    </div>
    <div id="panelContent">Select a constituency or region on the map to view nested details.</div>
  </div>

  <div id="map"></div>

  <script>
    // PMTiles Protocol Setup
    let protocol = new pmtiles.Protocol();
    leaflet.TileLayer.addInitHook(function() {
      if (this.options.url && this.options.url.endsWith('.pmtiles')) {
        let p = new pmtiles.PMTiles(this.options.url);
        protocol.add(p);
      }
    });

    var map = L.map('map', { 
      zoomControl: false,
      dragging: true,
      touchZoom: 'center',
      doubleClickZoom: true
    }).setView([22.5937, 78.9629], 5);

    // Create Dedicated Leaflet Panes to Prevent Vector Layer Obscuration
    map.createPane('popGridPane');
    map.getPane('popGridPane').style.zIndex = 300;

    map.createPane('adminBoundaryPane');
    map.getPane('adminBoundaryPane').style.zIndex = 400;

    map.createPane('electoralPane');
    map.getPane('electoralPane').style.zIndex = 500;

    map.createPane('selectionHighlightPane');
    map.getPane('selectionHighlightPane').style.zIndex = 600;

    var activeHighlightLayer = null;
    var searchMarker = null;
    var isPanelMinimized = false;
    var currentOverlayOpacity = 0.7;

    // Local Storage for Custom Pins Memory
    var storedPinsList = JSON.parse(localStorage.getItem('geo_saved_pins_v1') || '[]');

    // Basemaps
    var cleanMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
    var roadMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
    var satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Tiles &copy; Esri'
    });
    var nightlightsMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
    
    // WorldPop Population Layer
    var popDensityMap = L.tileLayer('https://sedac.ciesin.columbia.edu/geoserver/gwc/service/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&LAYER=gpw-v4:gpw-v4-population-density-rev11_2020&STYLE=&TILEMATRIXSET=EPSG:3857&TILEMATRIX=EPSG:3857:{z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png', {
      pane: 'popGridPane',
      opacity: 0.6, 
      maxZoom: 18
    });

    cleanMap.addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Layer Groups
    var stateLayer = L.layerGroup();
    var districtLayer = L.layerGroup();
    var talukaLayer = L.layerGroup();
    var pcLayer = L.layerGroup();          // Parliamentary (FUCHSIA)
    var acLayer = L.layerGroup();          // Assembly (CYAN)
    var villageLayer = L.layerGroup();
    var ruralRoadsLayer = L.layerGroup();
    var urbanWardsLayer = L.layerGroup();
    var policeLayer = L.layerGroup();
    var healthEduLayer = L.layerGroup();

    // 3 Dedicated Pin Toggle Layers
    var districtPinsLayer = L.layerGroup().addTo(map);
    var talukaPinsLayer = L.layerGroup().addTo(map);
    var villagePinsLayer = L.layerGroup().addTo(map);

    var loadedACFeatures = [];

    // Right-Side Layer Menu
    var baseMaps = {
      "🗺️ Clean Map": cleanMap,
      "🛣️ Road Layout": roadMap,
      "🛰️ Satellite Imagery": satelliteMap,
      "🌃 Nighttime Lights": nightlightsMap
    };

    var overlayMaps = {
      "<span style='color:#FF00FF; font-weight:700;'>🗳️ Parliamentary (Lok Sabha) [Fuchsia]</span>": pcLayer,
      "<span style='color:#00FFFF; font-weight:700;'>🗳️ Assembly (Vidhan Sabha) [Cyan]</span>": acLayer,
      "🔴 District Pins (Red)": districtPinsLayer,
      "🔵 Taluka Pins (Royal Blue)": talukaPinsLayer,
      "🟣 Village Pins (Violet)": villagePinsLayer,
      "👥 Population Grid": popDensityMap,
      "🗺️ State Boundaries (Dotted)": stateLayer,
      "🏛️ District Boundaries": districtLayer,
      "📍 Talukas / Tehsils": talukaLayer,
      "🏘️ Villages & Gram Panchayats": villageLayer,
      "🚜 Rural Roads": ruralRoadsLayer,
      "🏢 Urban & Wards": urbanWardsLayer,
      "🚓 Police Jurisdictions": policeLayer,
      "🏥 Healthcare & Schools": healthEduLayer
    };

    var layerControl = L.control.layers(baseMaps, overlayMaps, { position: 'topright', collapsed: false }).addTo(map);

    // Header in Top-Right Layer Menu
    var layerContainer = layerControl.getContainer();
    var layerHeader = document.createElement('div');
    layerHeader.style.cssText = 'display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:12px; border-bottom:1px solid #e5e5ea; padding-bottom:6px; margin-bottom:8px; cursor:pointer; color:#007AFF;';
    layerHeader.innerHTML = '<span>🥞 MAP LAYERS</span><button id="layerMinBtn" style="background:#e5e5ea; border:none; border-radius:50%; width:22px; height:22px; font-weight:700; cursor:pointer;">−</button>';
    layerContainer.insertBefore(layerHeader, layerContainer.firstChild);

    var isLayerMinimized = false;
    layerHeader.onclick = function() {
      var list = layerContainer.querySelector('.leaflet-control-layers-list');
      var btn = document.getElementById('layerMinBtn');
      if (isLayerMinimized) {
        list.style.display = 'block';
        btn.innerText = '−';
        isLayerMinimized = false;
      } else {
        list.style.display = 'none';
        btn.innerText = '+';
        isLayerMinimized = true;
      }
    };

    // SVG Color Pin Generator
    function createPinIcon(color) {
      return L.divIcon({
        className: 'custom-pin-icon',
        html: `<svg width="28" height="40" viewBox="0 0 24 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 36 12 36C12 36 24 21 24 12C24 5.37 18.63 0 12 0Z" fill="${color}" stroke="#FFFFFF" stroke-width="2"/>
                <circle cx="12" cy="12" r="4" fill="#FFFFFF"/>
               </svg>`,
        iconSize: [28, 40],
        iconAnchor: [14, 40],
        popupAnchor: [0, -36]
      });
    }

    // Active Selection Elephant Grey Border (#4A4D52)
    function highlightFeature(targetLayer) {
      if (activeHighlightLayer) map.removeLayer(activeHighlightLayer);
      
      activeHighlightLayer = L.geoJSON(targetLayer.toGeoJSON(), {
        pane: 'selectionHighlightPane',
        style: {
          color: '#4A4D52',        // Elephant Grey Outline
          weight: 5,
          opacity: 1,
          fillColor: '#4A4D52',    // Elephant Grey Fill
          fillOpacity: 0.45
        }
      }).addTo(map);

      activeHighlightLayer.bringToFront();
    }

    // Complete Reset Function
    function clearMapAll() {
      if (activeHighlightLayer) {
        map.removeLayer(activeHighlightLayer);
        activeHighlightLayer = null;
      }
      if (searchMarker) {
        map.removeLayer(searchMarker);
        searchMarker = null;
      }
      var dropdown = document.getElementById('stateDropdown');
      if (dropdown) dropdown.selectedIndex = 0;

      map.closePopup();
      closePanel();
      map.flyTo([22.5937, 78.9629], 5, { duration: 0.8 });
    }

    function togglePanelMinimize() {
      var content = document.getElementById('panelContent');
      var btn = document.getElementById('minBtn');
      if (isPanelMinimized) {
        content.style.display = 'block';
        btn.innerText = '−';
        isPanelMinimized = false;
      } else {
        content.style.display = 'none';
        btn.innerText = '+';
        isPanelMinimized = true;
      }
    }

    function closePanel() {
      document.getElementById('infoPanel').style.display = 'none';
      if (activeHighlightLayer) map.removeLayer(activeHighlightLayer);
    }

    function changeOverlayOpacity(val) {
      currentOverlayOpacity = parseFloat(val);
      
      pcLayer.eachLayer(layer => {
        if (layer.setStyle) layer.setStyle({ fillOpacity: currentOverlayOpacity * 0.28, opacity: currentOverlayOpacity });
      });
      acLayer.eachLayer(layer => {
        if (layer.setStyle) layer.setStyle({ fillOpacity: currentOverlayOpacity * 0.25, opacity: currentOverlayOpacity });
      });
      [stateLayer, districtLayer, talukaLayer, villageLayer].forEach(layerGroup => {
        layerGroup.eachLayer(layer => {
          if (layer.setStyle) layer.setStyle({ fillOpacity: currentOverlayOpacity * 0.05, opacity: currentOverlayOpacity });
        });
      });
      popDensityMap.setOpacity(currentOverlayOpacity);
    }

    function getNormalizedStateName(props) {
      if (!props) return "";
      return props.ST_NAME || props.st_name || props.STATE || props.state || props.STNAME || "";
    }

    // Smart Map Tap
    function handleMapTap(latlng, featureProps, featureType, targetLayer) {
      if (!latlng) return;

      var currentZoom = map.getZoom();
      var nextZoom = currentZoom < 8 ? 10 : (currentZoom < 12 ? 14 : Math.min(currentZoom + 2, 18));
      map.flyTo(latlng, nextZoom, { duration: 0.6 });

      var panel = document.getElementById('infoPanel');
      var panelTitle = document.getElementById('panelTitle');
      var panelContent = document.getElementById('panelContent');

      panel.style.display = 'flex';
      document.getElementById('panelContent').style.display = 'block';
      document.getElementById('minBtn').innerText = '−';
      isPanelMinimized = false;

      if (targetLayer) highlightFeature(targetLayer);

      var lat = latlng.lat.toFixed(5);
      var lng = latlng.lng.toFixed(5);

      if (featureType === 'PC') {
        var pcName = featureProps.PC_NAME || featureProps.pc_name || "Parliamentary Constituency";
        var stateName = getNormalizedStateName(featureProps) || "India";
        panelTitle.innerText = `🗳️ ${pcName}`;

        var matchingACs = loadedACFeatures.filter(ac => {
          if (!ac.properties) return false;
          var acPC = ac.properties.PC_NAME || ac.properties.pc_name;
          return acPC && acPC.toUpperCase() === pcName.toUpperCase();
        }).map(ac => ac.properties.AC_NAME || ac.properties.ac_name).filter(Boolean);

        var acHTML = matchingACs.length > 0 
          ? matchingACs.map(ac => `<span class="data-badge green-badge">🏛️ ${ac}</span>`).join('') 
          : `<span class="data-badge green-badge">Vidhan Sabha Seats Mapped</span>`;

        panelContent.innerHTML = `
          <div><small>State / UT:</small> <b>${stateName}</b></div>
          <div class="section-tag" style="color:#4A4D52;">✨ Selected: Elephant Grey Highlight</div>
          <div class="section-tag">🗳️ Underlying Vidhan Sabha Seats</div>
          <div style="margin-top:4px;">${acHTML}</div>
          <div class="section-tag">📍 Coordinates</div>
          <div>${lat}, ${lng}</div>
          <button class="search-btn" style="margin-top:8px; width:100%;" onclick="saveCustomPin(${lat}, ${lng})">📌 Save & Share Pin</button>
        `;
      } else if (featureType === 'AC') {
        var acName = featureProps.AC_NAME || featureProps.ac_name || "Assembly Constituency";
        var stateName = getNormalizedStateName(featureProps);
        panelTitle.innerText = `🏛️ ${acName}`;
        panelContent.innerHTML = `
          <div class="data-badge green-badge">Vidhan Sabha Constituency</div>
          ${stateName ? `<div><small>State / UT:</small> <b>${stateName}</b></div>` : ''}
          <div class="section-tag" style="color:#4A4D52;">✨ Selected: Elephant Grey Highlight</div>
          <div class="section-tag">📍 Coordinates</div>
          <div>${lat}, ${lng}</div>
          <button class="search-btn" style="margin-top:8px; width:100%;" onclick="saveCustomPin(${lat}, ${lng})">📌 Save & Share Pin</button>
        `;
      } else {
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.display_name) {
              var placeName = data.address.city || data.address.town || data.address.village || data.display_name.split(',')[0];
              panelTitle.innerText = `📍 ${placeName}`;
              panelContent.innerHTML = `
                <small>${data.display_name}</small>
                <div class="section-tag">📍 Lat-Long</div>
                <div><b>${lat}, ${lng}</b></div>
                <button class="search-btn" style="margin-top:10px; width:100%;" onclick="saveCustomPin(${lat}, ${lng}, '${placeName.replace(/'/g, "")}')">📌 Save & Share Pin</button>
              `;
            }
          }).catch(err => console.log('Location lookup...'));
      }
    }

    map.on('click', function(e) { handleMapTap(e.latlng, null, 'GENERAL'); });

    // Custom Pin Creator
    function saveCustomPin(lat, lng, defaultName) {
      var pinName = prompt("Enter a Name for this Pin:", defaultName || "Saved Point");
      if (!pinName) return;

      var tier = prompt("Select Pin Type:\n1 = District (Red)\n2 = Taluka (Royal Blue)\n3 = Village (Violet)", "1");
      
      var pinColor = "#FF3B30";
      var typeCode = "dist";
      if (tier === "2") { pinColor = "#4169E1"; typeCode = "taluka"; }
      if (tier === "3") { pinColor = "#8A2BE2"; typeCode = "village"; }

      storedPinsList.push({ lat: lat, lng: lng, name: pinName, color: pinColor, type: typeCode });
      localStorage.setItem('geo_saved_pins_v1', JSON.stringify(storedPinsList));

      dropNamedPin(lat, lng, pinName, pinColor, typeCode, true);
    }

    function dropNamedPin(lat, lng, name, color, typeCode, openPopup) {
      var icon = createPinIcon(color);
      var marker = L.marker([lat, lng], { icon: icon });

      if (typeCode === "taluka") {
        marker.addTo(talukaPinsLayer);
      } else if (typeCode === "village") {
        marker.addTo(villagePinsLayer);
      } else {
        marker.addTo(districtPinsLayer);
      }

      var shareUrl = `${window.location.origin}${window.location.pathname}?lat=${lat}&lng=${lng}&name=${encodeURIComponent(name)}&type=${typeCode}`;

      marker.bindPopup(`
        <b>📍 ${name}</b><br>
        <small>Lat: ${lat}, Lng: ${lng}</small><br>
        <button onclick="navigator.clipboard.writeText('${shareUrl}'); alert('🔗 Share link copied to clipboard!');" style="margin-top:6px; background:#007AFF; color:#fff; border:none; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer;">🔗 Copy Share Link</button>
      `);

      if (openPopup) marker.openPopup();
    }

    function loadSavedPinsFromMemory() {
      storedPinsList.forEach(p => {
        dropNamedPin(p.lat, p.lng, p.name, p.color, p.type, false);
      });
    }

    function checkUrlForSharedPin() {
      var params = new URLSearchParams(window.location.search);
      if (params.has('lat') && params.has('lng')) {
        var lat = parseFloat(params.get('lat'));
        var lng = parseFloat(params.get('lng'));
        var name = params.get('name') || "Shared Location";
        var typeCode = params.get('type') || "dist";

        var color = "#FF3B30";
        if (typeCode === "taluka") color = "#4169E1";
        if (typeCode === "village") color = "#8A2BE2";

        map.flyTo([lat, lng], 13, { duration: 0.8 });
        dropNamedPin(lat, lng, name, color, typeCode, true);
      }
    }

    // High-Availability Failover Data Fetcher
    function fetchGeoData(primaryUrl, fallbackUrl) {
      return fetch(primaryUrl)
        .then(res => {
          if (!res.ok) throw new Error("Primary failed");
          return res.json();
        })
        .catch(() => {
          console.warn("Primary fetch failed, using fallback mirror:", fallbackUrl);
          return fetch(fallbackUrl).then(res => res.json());
        });
    }

    // 1. Load ALL Parliamentary Seats (FUCHSIA GRID) via Failover CDN
    var pcPrimary = 'https://cdn.jsdelivr.net/gh/datameet/maps@master/Parliamentary/parliamentary_constituencies.geojson';
    var pcFallback = 'https://raw.githubusercontent.com/datameet/maps/master/Parliamentary/parliamentary_constituencies.geojson';

    fetchGeoData(pcPrimary, pcFallback)
      .then(geoJsonData => {
        L.geoJSON(geoJsonData, {
          pane: 'electoralPane',
          filter: function(feature) {
            return feature && feature.geometry && feature.geometry.coordinates;
          },
          style: function() {
            return { color: '#FF00FF', weight: 2.0, opacity: 0.9, fillColor: '#FF00FF', fillOpacity: 0.28 };
          },
          onEachFeature: function (feature, layer) {
            layer.on('click', function (e) {
              L.DomEvent.stopPropagation(e);
              handleMapTap(e.latlng, feature.properties, 'PC', layer);
            });
          }
        }).addTo(pcLayer);
      }).catch(err => console.error('PC Load Failure', err));

    // 2. Load ALL Vidhan Sabha Seats (CYAN GRID) via Failover CDN
    var acPrimary = 'https://cdn.jsdelivr.net/gh/datameet/maps@master/Assembly/assembly_constituencies.geojson';
    var acFallback = 'https://raw.githubusercontent.com/datameet/maps/master/Assembly/assembly_constituencies.geojson';

    fetchGeoData(acPrimary, acFallback)
      .then(geoJsonData => {
        if (geoJsonData.features) loadedACFeatures = geoJsonData.features;
        L.geoJSON(geoJsonData, {
          pane: 'electoralPane',
          filter: function(feature) {
            return feature && feature.geometry && feature.geometry.coordinates;
          },
          style: function() {
            return { color: '#00FFFF', weight: 1.8, opacity: 0.9, fillColor: '#00FFFF', fillOpacity: 0.25 };
          },
          onEachFeature: function (feature, layer) {
            layer.on('click', function (e) {
              L.DomEvent.stopPropagation(e);
              handleMapTap(e.latlng, feature.properties, 'AC', layer);
            });
          }
        }).addTo(acLayer);
      }).catch(err => console.log('AC Load Failure', err));

    // TopoJSON Failover Loader
    function loadTopoJSON(primaryUrl, fallbackUrl, targetLayer, styleOptions, nameProperty) {
      styleOptions.pane = 'adminBoundaryPane';
      fetchGeoData(primaryUrl, fallbackUrl)
        .then(topoData => {
          var objName = Object.keys(topoData.objects)[0];
          var geoJsonData = topojson.feature(topoData, topoData.objects[objName]);
          L.geoJSON(geoJsonData, {
            pane: 'adminBoundaryPane',
            style: styleOptions,
            onEachFeature: function (feature, layer) {
              var label = feature.properties ? (feature.properties[nameProperty] || "Boundary") : "Boundary";
              layer.on('click', function (e) {
                L.DomEvent.stopPropagation(e);
                handleMapTap(e.latlng, feature.properties, 'ADMIN', layer);
              });
              layer.bindPopup("<b>" + label + "</b>");
            }
          }).addTo(targetLayer);
        }).catch(err => console.error('TopoJSON load error', err));
    }

    // High-Contrast Administrative Outlines
    var statePrimary = 'https://cdn.jsdelivr.net/gh/datameet/maps@master/States/Admin2.topo.json';
    var stateFallback = 'https://raw.githubusercontent.com/datameet/maps/master/States/Admin2.topo.json';
    loadTopoJSON(statePrimary, stateFallback, stateLayer, { color: '#0051FF', weight: 2.8, dashArray: '6, 6', fillOpacity: 0.02 }, 'STNAME');
    stateLayer.addTo(map);

    var distPrimary = 'https://cdn.jsdelivr.net/gh/datameet/maps@master/Districts/Admin2.topo.json';
    var distFallback = 'https://raw.githubusercontent.com/datameet/maps/master/Districts/Admin2.topo.json';
    loadTopoJSON(distPrimary, distFallback, districtLayer, { color: '#FF9500', weight: 2.0, opacity: 0.85, fillOpacity: 0.04 }, 'DISTRICT');

    var subDistPrimary = 'https://cdn.jsdelivr.net/gh/datameet/maps@master/Subdistricts/Admin2.topo.json';
    var subDistFallback = 'https://raw.githubusercontent.com/datameet/maps/master/Subdistricts/Admin2.topo.json';
    loadTopoJSON(subDistPrimary, subDistFallback, talukaLayer, { color: '#AF52DE', weight: 1.5, opacity: 0.8, fillOpacity: 0.04 }, 'SUB_DIST');

    function zoomToState(value) {
      var coords = value.split(',');
      map.flyTo([parseFloat(coords[0]), parseFloat(coords[1])], parseInt(coords[2]), { duration: 0.8 });
    }

    // Fast Search
    function searchPlace() {
      var query = document.getElementById('searchInput').value;
      if (!query) return;

      var btn = document.getElementById('searchBtn');
      btn.innerText = '⏳...';
      btn.style.background = '#FF9500';

      fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(results => {
          btn.innerText = 'Go';
          btn.style.background = '#007AFF';

          if (results && results.length > 0) {
            var item = results[0];
            var lat = parseFloat(item.lat);
            var lon = parseFloat(item.lon);

            if (searchMarker) map.removeLayer(searchMarker);
            searchMarker = L.marker([lat, lon]).addTo(map);

            map.flyTo([lat, lon], 13, { duration: 0.6 });
            saveCustomPin(lat, lon, item.display_name.split(',')[0]);
          } else {
            alert('Place not found. Please try another search term.');
          }
        }).catch(err => {
          btn.innerText = 'Go';
          btn.style.background = '#007AFF';
          alert('Search error. Check network connection.');
        });
    }

    function handleSearchKey(e) { if (e.key === 'Enter') searchPlace(); }

    // Startup Loaders
    loadSavedPinsFromMemory();
    checkUrlForSharedPin();
  </script>
</body>
</html>
