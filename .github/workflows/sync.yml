name: Selected Geodata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost

      - name: Transfer Selected Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: "yashveeeeeeer/india-geodata"
          TARGET_REPO: "${{ github.repository }}"
        run: |
          # List of EXACT tags selected: Villages, Rural Roads, Buildings, Urban, Police, Health, Education, Nightlights
          TARGET_TAGS=(
            "admin/villages"
            "admin/panchayats"
            "admin/blocks"
            "infrastructure/rural_roads"
            "buildings"
            "urban"
            "police"
            "healthcare"
            "education"
            "remote-sensing/nightlights"
          )

          for TAG in "${TARGET_TAGS[@]}"; do
            echo "=========================================="
            echo " Processing Target Tag: $TAG"
            echo "=========================================="
            
            gh release create "$TAG" -R "$TARGET_REPO" --title "$TAG" || true
            ASSETS=$(gh release view "$TAG" -R "$SOURCE_REPO" --json assets -q '.assets[].name' || true)

            for ASSET in $ASSETS; do
              echo "Transferring file: $ASSET"
              DIR="./tmp_download"
              rm -rf "$DIR" && mkdir -p "$DIR"

              gh release download "$TAG" -R "$SOURCE_REPO" -p "$ASSET" -D "$DIR" --clobber || continue

              if [ -f "$DIR/$ASSET" ]; then
                gh release upload "$TAG" -R "$TARGET_REPO" "$DIR/$ASSET" --clobber
              fi

              rm -rf "$DIR"
            done
          done
