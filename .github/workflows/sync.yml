name: Sync 160GB Geodata Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost

      - name: Transfer Releases Cloud-to-Cloud
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: "yashveeeeeeer/india-geodata"
          TARGET_REPO: "${{ github.repository }}"
        run: |
          RELEASES=$(gh release list -R "$SOURCE_REPO" --limit 1000 --json tagName,name)
          echo "$RELEASES" | jq -c '.[]' | while read -r rel; do
            TAG=$(echo "$rel" | jq -r '.tagName')
            TITLE=$(echo "$rel" | jq -r '.name // .tagName')
            
            echo "=========================================="
            echo " Processing Tag: $TAG"
            echo "=========================================="
            
            # Create container for this release tag
            gh release create "$TAG" -R "$TARGET_REPO" --title "$TITLE" || true

            # Get list of files in this release
            ASSETS=$(gh release view "$TAG" -R "$SOURCE_REPO" --json assets -q '.assets[].name')

            # Transfer each file individually to save space
            for ASSET in $ASSETS; do
              echo "Transferring file: $ASSET"
              DIR="./tmp_download"
              rm -rf "$DIR" && mkdir -p "$DIR"

              # Download single file
              gh release download "$TAG" -R "$SOURCE_REPO" -p "$ASSET" -D "$DIR" --clobber || continue

              # Upload single file
              if [ -f "$DIR/$ASSET" ]; then
                gh release upload "$TAG" -R "$TARGET_REPO" "$DIR/$ASSET" --clobber
              fi

              # Clean disk immediately
              rm -rf "$DIR"
            done
          done
