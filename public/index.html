<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gujarat Campaign Map</title>
    <!-- Leaflet Map CSS Styling -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
           <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        /* Enlarged UI Control Panel */
        .leaflet-top.leaflet-right {
            margin: 20px;
        }
        .campaign-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 340px;
        }
        .campaign-panel h3 {
            margin: 0 0 15px 0;
            font-size: 20px;
            color: #222;
        }
        .campaign-panel label {
            display: block;
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }
        .campaign-panel select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 2px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
        }
    </style>

    </style>
</head>
<body>

    <!-- The Map Canvas -->
    <div id="map"></div>

    <!-- Floating UI Panel injected directly into Leaflet's control system -->
    <div id="ui-container" style="display: none;">
        <div class="campaign-panel">
            <h3>Gujarat Campaign Control</h3>
            
            <label for="district-select">District</label>
            <select id="district-select" disabled>
                <option value="">-- Loading Districts --</option>
            </select>

            <label for="taluka-select">Taluka</label>
            <select id="taluka-select" disabled>
                <option value="">-- Select District First --</option>
            </select>

            <label for="village-select">Village / Panchayat</label>
            <select id="village-select" disabled>
                <option value="">-- Select Taluka First --</option>
            </select>
        </div>
    </div>

    <!-- Leaflet JavaScript Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Your Map Loader Script -->
    <script src="map-loader.js"></script>
    
    <script>
        // Move the floating panel onto the top right of the map automatically
        var uiDiv = document.getElementById('ui-container');
        uiDiv.style.display = 'block';
        var customControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function () { return uiDiv; }
        });
        // This will be handled once map-loader runs, but keeps the HTML self-contained
    </script>
</body>
</html>
