<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Map - Gujarat</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Initialize map centered over Gujarat
        const map = L.map('map').setView([22.2587, 71.1924], 7);

        // 2. Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let geojsonLayer = null;

        // 3. Load GeoJSON data directly
        fetch("data/states/gujarat.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                geojsonLayer = L.geoJSON(data, {
                    style: {
                        color: '#333333',
                        weight: 1.5,
                        fillColor: '#3498db',
                        fillOpacity: 0.3
                    },
                    onEachFeature: function (feature, layer) {
                        let props = feature.properties || {};
                        let name = props.name || props.NAME || props.DISTRICT || props.district || props.DIST_NAME || "Target Area";
                        
                        layer.bindTooltip(name, { sticky: true });

                        // Click handler to zoom directly into the selected region bounds
                        layer.on('click', function (e) {
                            geojsonLayer.eachLayer(l => {
                                l.setStyle({
                                    color: '#333333',
                                    weight: 1.5,
                                    fillColor: '#3498db',
                                    fillOpacity: 0.3
                                });
                            });

                            layer.setStyle({
                                color: '#c0392b',
                                weight: 2.5,
                                fillColor: '#e74c3c',
                                fillOpacity: 0.5
                            });

                            const bounds = layer.getBounds();
                            if (bounds.isValid()) {
                                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10, animate: true });
                            }
                        });
                    }
                }).addTo(map);

                // Initial fit to data bounds if valid
                const initialBounds = geojsonLayer.getBounds();
                if (initialBounds.isValid()) {
                    map.fitBounds(initialBounds, { padding: [20, 20] });
                }
            })
            .catch(error => {
                console.error("Failed to load map data:", error);
            });
    </script>
</body>
</html>
