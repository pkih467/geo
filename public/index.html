<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gujarat</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
            background: #f2f2f2;
        }
        /* Dropdown Control Panel Styling */
        .campaign-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 340px;
        }
        .campaign-panel h3 {
            margin: 0 0 15px 0;
            font-size: 20px;
            color: #222;
            text-transform: lowercase;
        }
        .campaign-panel label {
            display: block;
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }
        .campaign-panel select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 2px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- UI Panel Container -->
    <div style="display: none;">
        <div id="ui-container" class="campaign-panel">
            <h3>gujarat</h3>
            
            <label for="district-select">District</label>
            <select id="district-select" disabled>
                <option value="">-- Loading Districts --</option>
            </select>

            <label for="taluka-select">Taluka</label>
            <select id="taluka-select" disabled>
                <option value="">-- Select District First --</option>
            </select>

            <label for="village-select">Village / Panchayat</label>
            <select id="village-select" disabled>
                <option value="">-- Select Taluka First --</option>
            </select>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Map Logic -->
    <script src="map-loader.js"></script>
</body>
</html>
